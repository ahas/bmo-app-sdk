# How the testbed tests, checks, builds and deploys this repository (the testbed's
# docs/declaration.md). A base library is taken by its consumers and built inside their
# builds, so it installs no service; what it builds and deploys is the one command it lends
# the machine.

testbed = 0
name = "bmo-app-sdk"

[test]
languages = ["cargo"]

[check]
# The English-only rule, the layout, the dependencies the manifests name, and personal data.
quick = ["korean", "layout", "dependencies", "personal-data"]
korean_ledger = "korean-ledger.json"
# A base library stands on registry crates alone.
base_libraries = []

# The scripts the generator hands out and the scaffold runs are shell; the testbed has no
# shell language, so their syntax is checked as a step of its own.
[[check.step]]
id = "shell-syntax"
command = "for file in bin/*.sh templates/*.sh; do sh -n \"$file\"; done"

[build]
binaries = ["bmo-app"]

# The repository runs no service, so the deployment starts no unit. What it deploys is the
# one command it lends the machine.
[deploy]
# Its own root, apart from the SDK tree an application's deployment lays at ~/.local/share/bmo-app-sdk
# for its build to read by a path (docs/app-command.md, 「How it reaches a machine」).
root = "~/.local/share/bmo-app"
data_root = "~/.local/share/bmo/data"
units = []

# The command, linked into the folder holding `bmo`, where the entry command finds its unit
# commands. The link names this repository's deploy tree, whose own link stands across
# releases; a link made to the release being deployed would dangle once a later deployment
# prunes that release.
[[deploy.step]]
id = "link-command"
phase = "before-flip"
command = '''
set -eu
mkdir -p "$HOME/.local/bin"
ln -sfn "$HOME/.local/share/bmo-app/deploy/bin/bmo-app" "$HOME/.local/bin/bmo-app"
'''
